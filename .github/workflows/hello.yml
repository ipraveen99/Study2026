name: Practice

on:
  workflow_dispatch:

jobs:
  Lab-1-First-Workflow:
    runs-on: ubuntu-latest
    steps:
      - name: "First Workflow"
        run: echo 'Hello DevOps'

  Lab-2-Linux-Runner:
    needs: Lab-1-First-Workflow
    runs-on: ubuntu-latest
    steps:
      - name: "Linux Runner"
        run: |
            echo "  Present Working Directory : " pwd
            echo "  Who am i : " whoami
            echo "  Date : " date
            echo "  User : " user -a

  Lab-3-Repository-Inspection:
    needs: Lab-2-Linux-Runner
    runs-on: ubuntu-latest
    steps:
      - name: "Repository Inspection"
        run: |
            ls
            ls -a
            find

  Lab-4-Environment-Variables:
    needs: Lab-3-Repository-Inspection
    runs-on: ubuntu-latest
    steps:
      - name: "Environment Variables"
        run: |
            echo "GITHUB_WORKFLOW : " ${{github.workflow}}
            echo "GITHUB_REPOSITORY : " ${{github.repository}}
            echo "GITHUB_REF : " ${{github.ref}}
            echo "GITHUB_SHA : " ${{github.sha}}
            echo "RUNNER_OS : " ${{runner.os}}

  Lab-5-Multiple-Jobs-System-Info:
    needs: Lab-4-Environment-Variables
    runs-on: ubuntu-latest
    steps:
      - name: "System Info"
        run: |
            echo "  Present Working Directory : " pwd
            echo "  Who am i : " whoami
            echo "  Date : " date
            echo "  User : " user -a

  Lab-5-Multiple-Jobs-Repository-Details:
    needs: Lab-4-Environment-Variables
    runs-on: ubuntu-latest
    steps:
      - name: "Repository Details"
        run: |
            ls
            ls -a
            find

  Lab-6-Multiple-Steps:
    needs:
      - Lab-5-Multiple-Jobs-System-Info
      - Lab-5-Multiple-Jobs-Repository-Details
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7
        
      - name: "Print date"
        run: date
        
      - name: "Print working directory"
        run: pwd

      - name: "List files"
        run: ls -ashs

      - name: "Print completion message"
        run: echo "Job completed"
        
