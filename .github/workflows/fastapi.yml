name: Fast API

on:
  workflow_dispatch:

jobs:
  FastAPI-Deployment:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository files
        uses: actions/checkout@v4

      - name: Verify checked-out files
        run: ls -al

      - name: Install Python
        run: |
            sudo apt update
            sudo apt install -y python3 python3-pip python3-venv
            python3 --version
            python3 -m pip --version
