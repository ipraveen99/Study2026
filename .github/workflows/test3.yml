name: Website CI
env:
  APP_NAME: devops-company-site
  ENVIRONMENT: development
  COMPANY: CloudNova
 
on:
  push:
    branches:
    - main
    
jobs:
  build:
    runs-on: ubuntu-latest
 
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Application Name ${{env.APP_NAME}}
      run: |
        echo $APP_NAME
        echo $ENVIRONMENT
        echo $COMPANY
 
    - name: Display ls
      run: ls 
      
  verify:
    needs: build
    runs-on: ubuntu-latest
 
    steps:
    - name: Finished
      run: echo Finished
