name: Secrets Lab Challenges
env:
  WORKFLOW_VAR: "Workflow Level Variable Value"
  STEP_PRECEDENCE_TEST_VAR: "Workflow"
  JOB_PRECEDENCE_TEST_VAR: "Workflow"
  COURSE: "Linux"
  FILE_NAME1: "system-info.txt"

on:
  push:
    branches:
    - main

jobs:
  Lab1-Variable-Scope:
    runs-on: ubuntu-latest
    env:
      JOB_VAR: "Job Level Variable Value"
      JOB_PRECEDENCE_TEST_VAR: "Job"
      

    steps:
      - name: Variable Scope
        run: |
           echo " Variable WORKFLOW_VAR = " ${{env.WORKFLOW_VAR}}
           echo " Variable JOB_VAR = " ${{env.JOB_VAR}}
           echo " Variable STEP_VAR = " ${{env.STEP_VAR}}
           echo " Variable JOB_PRECEDENCE_TEST_VAR = " ${{env.JOB_PRECEDENCE_TEST_VAR}}
           echo " Variable STEP_PRECEDENCE_TEST_VAR = " ${{env.STEP_PRECEDENCE_TEST_VAR}}
        env:
          STEP_VAR: "Step Level Variable Value"
          STEP_PRECEDENCE_TEST_VAR: "Step"

  Lab2-Repository-Variable-VS-Workflow-Variable:
    runs-on: ubuntu-latest
    
    steps:
      - name: Repository Variable VS Workflow Variable
        run: |
           echo " Repository Variable COURSE = " ${{vars.COURSE}}
           echo " Workflow Variable COURSE = " ${{env.COURSE}}

  Lab3-Missing-Repository-Variable:
    runs-on: ubuntu-latest
    
    steps:
      - name: Missing Repository Variable
        run: |
           echo " Repository Variable COURSE = " ${{vars.COURSE}}
           echo " Workflow Variable COURSE = " ${{env.COURSE}}
           echo " Missing Repository Variable COURSE1 = " ${{vars.COURSE1}}

  Lab4-Variable-VS-Secret:
    runs-on: ubuntu-latest
    
    steps:
      - name: Variable VS Secret
        run: |
           echo " Repository Variable USERNAME = " ${{vars.USERNAME}}
           echo " Secret Variable PASSWORD = " ${{secrets.PASSWORD}}

  Lab5-Secret-Leak-Investigation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Secret Leak Investigation
        run: echo " Secret Leak Investigation of Variable PASSWORD = " ${{secrets.PASSWORD}}  

  Lab6-Build-Information-Report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Create Empty File
        run: touch "${{env.FILE_NAME1}}"
      - name: Store actor to the file
        run: echo " Actor= ${{github.actor}}" >> "${{env.FILE_NAME1}}"
      - name: Store repository to the file
        run: echo " Repository= ${{github.repository}}" >> "${{env.FILE_NAME1}}"  
      - name: Store sha to the file
        run: echo " Sha= ${{github.sha}}" >> "${{env.FILE_NAME1}}"  
      - name: Store os to the file
        run: echo " OS= ${{runner.os}}" >> "${{env.FILE_NAME1}}"  
      - name: Store date to the file
        run: echo " Date= $(date +"%Y/%m/%d %H:%M:%S %A")" >> "${{env.FILE_NAME1}}"  
      - name: Directory details
        run: ls -la 
      - name: Output
        run: cat "${{env.FILE_NAME1}}"  

  Lab7-Development-Vs-Production:
    runs-on: ubuntu-latest
    
    steps:
      - name: Development VS Production
        run: echo " var.ENVIRONMENT = " ${{vars.ENVIRONMENT}}  
      - name: Run development task
        if: ${{ vars.ENVIRONMENT == 'development' }}
        run: |
          echo "Running DEVELOPMENT workflow"
          echo "This is for development testing."
      - name: Run production task
        if: ${{ vars.ENVIRONMENT == 'production' }}
        run: |
          echo "Running PRODUCTION workflow"
          echo "This is for production release."
      - name: Invalid environment warning
        if: ${{ vars.ENVIRONMENT != 'development' && vars.ENVIRONMENT != 'production' }}
        run: |
          echo "Invalid ENVIRONMENT value: ${{ vars.ENVIRONMENT }}"
          echo "Please set ENVIRONMENT as development or production."
